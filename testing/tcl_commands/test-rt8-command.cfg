namespace import testing_helpers::*

adapter driver dummy
transport select jtag
jtag newtap chip cpu -irlen 4
dap create chip.dap -tap chip.cpu
target create chip.cpu cortex_m -dap chip.dap -rtos chibios-rt8
check_matches {^chibios-rt8$} {chip.cpu cget -rtos}

check_error_matches {} {target create other.cpu testee -tap chip.cpu -rtos chibios-rt8}

# Explicit SMP configuration shares RTOS state across all group members.
target create chip.cpu1 cortex_m -dap chip.dap -coreid 1 -rtos chibios-rt8
target smp chip.cpu chip.cpu1
check_matches {^chibios-rt8$} {chip.cpu1 cget -rtos}
chip.cpu1 configure -rtos none
check_matches {^$} {chip.cpu cget -rtos}
check_matches {^$} {chip.cpu1 cget -rtos}

# Reject ambiguous core IDs and auto-detection before sharing any state.
target create dup.cpu0 cortex_m -dap chip.dap -coreid 0 -rtos chibios-rt8
target create dup.cpu1 cortex_m -dap chip.dap -coreid 0 -rtos chibios-rt8
check_error_matches {} {target smp dup.cpu0 dup.cpu1}
target create auto.cpu0 cortex_m -dap chip.dap -coreid 0 -rtos auto
target create auto.cpu1 cortex_m -dap chip.dap -coreid 1 -rtos auto
check_error_matches {} {target smp auto.cpu0 auto.cpu1}

# Leave a shared object alive to exercise normal shutdown too.
chip.cpu configure -rtos chibios-rt8
target smp chip.cpu chip.cpu1

shutdown
